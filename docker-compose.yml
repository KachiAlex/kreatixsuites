# VPS deployment: app + optional Caddy for automatic HTTPS.
# Default: app publishes on APP_PORT (3001) — works behind an existing
# reverse proxy or directly on an IP. For managed TLS with a domain:
#   SITE_ADDRESS=suite.example.com docker compose --profile tls up -d
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET:?set in .env}
      - PORT=3001
    ports:
      - "${APP_PORT:-3001}:3001"
    volumes:
      - kreatix-data:/data

  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  kreatix-data:
  caddy-data:
  caddy-config:
