# VPS deployment: app + optional Caddy for automatic HTTPS.
# Default: app publishes on APP_PORT (3001) — works behind an existing
# reverse proxy or directly on an IP. For managed TLS with a domain:
#   SITE_ADDRESS=suite.example.com docker compose --profile tls up -d
services:
  db:
    # pgvector-enabled Postgres — drop-in for postgres:17, adds CREATE EXTENSION vector
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=kreatix
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
      - POSTGRES_DB=kreatix
    volumes:
      - kreatix-pgdata:/var/lib/postgresql/data
    # loopback-only publish so `pnpm dev:api` on the host can reach Postgres
    ports:
      - "${PG_BIND:-127.0.0.1}:${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kreatix -d kreatix"]
      interval: 5s
      timeout: 3s
      retries: 24
    # internal-only — never published to the host

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - JWT_SECRET=${JWT_SECRET:?set in .env}
      - KREATIX_DATABASE_URL=postgres://kreatix:${POSTGRES_PASSWORD}@db:5432/kreatix
      - KREATIX_DATA_DIR=/data
      - PORT=3001
      # optional config — empty values are ignored by the app
      - KREATIX_DATA_KEY=${KREATIX_DATA_KEY:-}
      - KREATIX_SCAN_CMD=${KREATIX_SCAN_CMD:-}
      - KREATIX_AI_KEY=${KREATIX_AI_KEY:-}
      - KREATIX_AI_BASE_URL=${KREATIX_AI_BASE_URL:-}
      - KREATIX_AI_MODEL=${KREATIX_AI_MODEL:-}
      - KREATIX_AI_MODEL_EDIT=${KREATIX_AI_MODEL_EDIT:-}
      - KREATIX_AI_MODEL_PLAN=${KREATIX_AI_MODEL_PLAN:-}
      - KREATIX_AI_MODEL_ASK=${KREATIX_AI_MODEL_ASK:-}
      - KREATIX_AI_MODEL_COMPLETE=${KREATIX_AI_MODEL_COMPLETE:-}
      - KREATIX_AI_REASONING_EFFORT=${KREATIX_AI_REASONING_EFFORT:-}
      - KREATIX_AI_MODEL_BUSINESS=${KREATIX_AI_MODEL_BUSINESS:-}
      - KREATIX_AI_MODEL_ASK_BUSINESS=${KREATIX_AI_MODEL_ASK_BUSINESS:-}
      - KREATIX_AI_MODEL_EDIT_BUSINESS=${KREATIX_AI_MODEL_EDIT_BUSINESS:-}
      - KREATIX_AI_MODEL_PLAN_BUSINESS=${KREATIX_AI_MODEL_PLAN_BUSINESS:-}
      - KREATIX_AI_MODEL_COMPLETE_BUSINESS=${KREATIX_AI_MODEL_COMPLETE_BUSINESS:-}
      # provider failover + optional embeddings (semantic workspace search)
      - KREATIX_AI_FALLBACK_KEY=${KREATIX_AI_FALLBACK_KEY:-}
      - KREATIX_AI_FALLBACK_BASE_URL=${KREATIX_AI_FALLBACK_BASE_URL:-}
      - KREATIX_AI_FALLBACK_MODEL=${KREATIX_AI_FALLBACK_MODEL:-}
      - KREATIX_AI_EMBED_KEY=${KREATIX_AI_EMBED_KEY:-}
      - KREATIX_AI_EMBED_BASE_URL=${KREATIX_AI_EMBED_BASE_URL:-}
      - KREATIX_AI_EMBED_MODEL=${KREATIX_AI_EMBED_MODEL:-}
      # AI quota + cost controls (empty = app defaults)
      - KREATIX_AI_TRIAL_REQUESTS=${KREATIX_AI_TRIAL_REQUESTS:-}
      - KREATIX_AI_ORG_TOKENS_BASE=${KREATIX_AI_ORG_TOKENS_BASE:-}
      - KREATIX_AI_ORG_TOKENS_PER_SEAT=${KREATIX_AI_ORG_TOKENS_PER_SEAT:-}
      - KREATIX_AI_ORG_TOKENS_BUSINESS_BASE=${KREATIX_AI_ORG_TOKENS_BUSINESS_BASE:-}
      - KREATIX_AI_ORG_TOKENS_BUSINESS_PER_SEAT=${KREATIX_AI_ORG_TOKENS_BUSINESS_PER_SEAT:-}
      - KREATIX_AI_USER_DAILY=${KREATIX_AI_USER_DAILY:-}
      - KREATIX_AI_USER_DAILY_BUSINESS=${KREATIX_AI_USER_DAILY_BUSINESS:-}
      - KREATIX_AI_USER_PER_MIN=${KREATIX_AI_USER_PER_MIN:-}
      - KREATIX_AI_USER_PER_MIN_BUSINESS=${KREATIX_AI_USER_PER_MIN_BUSINESS:-}
      - KREATIX_AI_MONTHLY_BUDGET_USD=${KREATIX_AI_MONTHLY_BUDGET_USD:-}
      - KREATIX_AI_PRICE_IN_PER_MTOK=${KREATIX_AI_PRICE_IN_PER_MTOK:-}
      - KREATIX_AI_PRICE_OUT_PER_MTOK=${KREATIX_AI_PRICE_OUT_PER_MTOK:-}
      - KREATIX_OIDC_ISSUER=${KREATIX_OIDC_ISSUER:-}
      - KREATIX_OIDC_CLIENT_ID=${KREATIX_OIDC_CLIENT_ID:-}
      - KREATIX_OIDC_CLIENT_SECRET=${KREATIX_OIDC_CLIENT_SECRET:-}
      - KREATIX_OIDC_REDIRECT=${KREATIX_OIDC_REDIRECT:-}
      - KREATIX_OIDC_SCOPE=${KREATIX_OIDC_SCOPE:-}
      - KREATIX_SUPERADMIN_EMAIL=${KREATIX_SUPERADMIN_EMAIL:-}
      - KREATIX_SUPERADMIN_PASSWORD=${KREATIX_SUPERADMIN_PASSWORD:-}
      - KREATIX_PAYSTACK_SECRET=${KREATIX_PAYSTACK_SECRET:-}
      - KREATIX_PUBLIC_URL=${KREATIX_PUBLIC_URL:-}
      - KREATIX_BREVO_API_KEY=${KREATIX_BREVO_API_KEY:-}
      - KREATIX_MAIL_FROM=${KREATIX_MAIL_FROM:-}
      - KREATIX_MAIL_FROM_NAME=${KREATIX_MAIL_FROM_NAME:-}
      - KREATIX_ENTITLEMENT_SECRET=${KREATIX_ENTITLEMENT_SECRET:-}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3001}:3001"
    volumes:
      - kreatix-data:/data

  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  kreatix-data:
  kreatix-pgdata:
  caddy-data:
  caddy-config:
