# Kreatix Business Suite — nginx site for the shared VPS pattern.
# Answers plain-IP requests (server_name is the box IP); when a domain is
# added, replace server_name with it and run certbot for TLS.
server {
    listen 80;
    server_name 67.211.210.8;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
    }
}
