# Kreatix Business Suite — nginx site for the shared VPS pattern.
# sslip.io resolves any *.67-211-210-8.sslip.io to this host automatically.
# HTTPS cert provisioned via certbot (see sites-enabled for managed lines).
server {
    server_name kreatixsuite.67-211-210-8.sslip.io;

    client_max_body_size 50M;

    # text payload compression (hashed assets also get far-future cache below)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2 application/manifest+json;

    # baseline security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # CSP — fully self-hosted (tesseract OCR assets served from /tesseract);
    # 'wasm-unsafe-eval' is required for the tesseract wasm core.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss: ws: https://cloudflareinsights.com; worker-src 'self' blob:; media-src 'self' blob: data:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; manifest-src 'self'" always;
    # dictation uses the mic; camera/geolocation unused
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kreatixsuite.67-211-210-8.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kreatixsuite.67-211-210-8.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = kreatixsuite.67-211-210-8.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name kreatixsuite.67-211-210-8.sslip.io;
    return 404; # managed by Certbot


}