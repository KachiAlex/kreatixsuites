# Kreatix Meet — Jitsi web on 127.0.0.1:3030 (docker-jitsi-meet)
server {
    server_name meet.kreatixtech.com meet.67-211-210-8.sslip.io;
    client_max_body_size 20M;
    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        # the suite embeds Jitsi via JitsiMeetExternalAPI — SAMEORIGIN blocks
        # it; drop upstream XFO and scope embedding to suite origins instead
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy "frame-ancestors 'self' https://suites.kreatixtech.com https://kreatixsuite.67-211-210-8.sslip.io https://meet.kreatixtech.com https://meet.67-211-210-8.sslip.io" always;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/meet.67-211-210-8.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/meet.67-211-210-8.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;


}

server {
    if ($host = meet.kreatixtech.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = meet.67-211-210-8.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name meet.kreatixtech.com meet.67-211-210-8.sslip.io;
    listen 80;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }




}
