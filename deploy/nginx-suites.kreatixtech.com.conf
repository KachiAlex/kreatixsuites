# Kreatix Business Suite — suites.kreatixtech.com → app container :3017
server {
    server_name suites.kreatixtech.com;
    # Origin lockdown: only Cloudflare edge IPs may reach this vhost —
    # direct-to-origin requests bypass the WAF otherwise.
    include /etc/nginx/cloudflare-only.conf;

    client_max_body_size 50M;
    # text payload compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2 application/manifest+json;

    # baseline security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "0" always;
    # Meet mounts external_api.js from the Jitsi host — keep its origin in
    # script-src, else the iframe never mounts and the stage is black.
    # Wildcard scheme sources removed: img-src/frame-src/connect-src now
    # enumerate explicit origins (VAPT remediation 2026-10).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://meet.kreatixtech.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://suites.kreatixtech.com wss://meet.kreatixtech.com https://cloudflareinsights.com; worker-src 'self' blob:; media-src 'self' blob: data:; frame-src 'self' https://meet.kreatixtech.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; manifest-src 'self'" always;
    # dictation uses the mic; the Meet iframe needs mic/camera/screenshare
    add_header Permissions-Policy "microphone=(self \"https://meet.kreatixtech.com\"), camera=(self \"https://meet.kreatixtech.com\"), display-capture=(self \"https://meet.kreatixtech.com\"), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # The upstream app sends its own CSP — hide it so exactly one policy is
    # delivered (the one above).
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header X-XSS-Protection;


    location / {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
    }

    # Sheets script sandbox — opaque-origin iframe page, own eval CSP.
    location = /script-sandbox.html {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-XSS-Protection "0" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/suites.kreatixtech.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/suites.kreatixtech.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = suites.kreatixtech.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name suites.kreatixtech.com;
    listen 80;
    return 404; # managed by Certbot


}
