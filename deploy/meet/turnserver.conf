# Kreatix coturn — TURN/STUN relay for clients on UDP-restricted networks.
# Listens UDP 443 (QUIC-shaped traffic — passes most corporate firewalls);
# coturn answers STUN + TURN on the same port. Replace ${TURN_CREDENTIALS}
# with the shared secret from /opt/kreatix-meet/.env (must match the
# TURN_CREDENTIALS value Prosody advertises via external_services).
listening-port=443
min-port=49160
max-port=49200
realm=kreatix
use-auth-secret
static-auth-secret=${TURN_CREDENTIALS}
external-ip=67.211.210.8
log-file=stdout
